[[pregunta]]
id = "auto"
tipo = "opcion"
texto = "¿Tienen auto o moto?"
opciones = [{ valor = "si", texto = "Sí" }, { valor = "no", texto = "No" }]

[[pregunta]]
id = "gasolina"
tipo = "monto"
cada = "mes"
rubros = ["gasolina"]
si = { pregunta = "auto", es = "si" }
texto = "¿Cuánto en gasolina al mes?"

[[pregunta]]
id = "auto_gastos"
tipo = "monto"
cada = "año"
rubros = ["auto_gastos"]
si = { pregunta = "auto", es = "si" }
texto = "¿Cuánto al año en el auto: servicio, reparaciones, seguro, tenencia y verificación, casetas y estacionamiento?"

[[pregunta]]
id = "credito_auto"
tipo = "monto"
cada = "mes"
no_cubierto = "credito_auto"
si = { pregunta = "auto", es = "si" }
