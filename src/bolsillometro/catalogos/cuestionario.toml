# Cuestionario estandarizado para armar un presupuesto de Bolsillómetro.
#
# Lo usa quien entrevista (Claude, la web o una persona): las preguntas van en este orden y con
# este texto. Las respuestas se guardan como JSON {id: valor} y `bolsillometro entrevista`
# las convierte en un presupuesto.toml. Campos de cada pregunta:
#
# - tipo: "ciudad", "opcion", "monto" (pesos) o "porcentaje" (aumento anual, -99 a 1000).
# - cada: para montos, cómo se pregunta: "mes" o "año" (los anuales se dividen entre 12). La
#   respuesta puede traer su propia frecuencia: {"monto": 900, "cada": "bimestre"}.
# - rubros: rubros que llena un monto; si son varios, se reparte con los ponderadores oficiales.
# - no_cubierto / aumento_propio: a dónde va la respuesta, si no es gasto que mide el INPC.
# - si: solo se pregunta si otra respuesta cumple: {pregunta, es} o {pregunta, mayor_que}.
# - opcional: se puede saltar; si no, sin respuesta cuenta como 0.
# - escala: las opciones (a lo más 4) con que se pregunta un monto o un porcentaje; cada una
#   trae el valor que se usa al elegirla. La respuesta puede ser ese texto o un monto exacto.

version = 1

# Opciones estándar de respuesta. El valor es un punto representativo del rango.
[escalas]
servicios = [
  { texto = "Nada", valor = 0 },
  { texto = "Menos de $300", valor = 200 },
  { texto = "$300 a $700", valor = 500 },
  { texto = "Más de $700", valor = 1000 },
]
mes_chico = [
  { texto = "Nada", valor = 0 },
  { texto = "Menos de $500", valor = 300 },
  { texto = "$500 a $1,500", valor = 1000 },
  { texto = "Más de $1,500", valor = 2200 },
]
mes_mediano = [
  { texto = "Nada", valor = 0 },
  { texto = "Menos de $1,000", valor = 600 },
  { texto = "$1,000 a $3,000", valor = 2000 },
  { texto = "Más de $3,000", valor = 4500 },
]
mes_grande = [
  { texto = "Nada", valor = 0 },
  { texto = "Menos de $5,000", valor = 3500 },
  { texto = "$5,000 a $12,000", valor = 8500 },
  { texto = "Más de $12,000", valor = 16000 },
]
comida = [
  { texto = "Menos de $4,000", valor = 3000 },
  { texto = "$4,000 a $8,000", valor = 6000 },
  { texto = "$8,000 a $12,000", valor = 10000 },
  { texto = "Más de $12,000", valor = 15000 },
]
comer_fuera = [
  { texto = "Nada", valor = 0 },
  { texto = "Menos de $1,500", valor = 1000 },
  { texto = "$1,500 a $4,000", valor = 2750 },
  { texto = "Más de $4,000", valor = 6000 },
]
gasolina = [
  { texto = "Menos de $1,000", valor = 700 },
  { texto = "$1,000 a $2,500", valor = 1750 },
  { texto = "$2,500 a $5,000", valor = 3750 },
  { texto = "Más de $5,000", valor = 6500 },
]
anio_chico = [
  { texto = "Nada", valor = 0 },
  { texto = "Menos de $3,000", valor = 2000 },
  { texto = "$3,000 a $10,000", valor = 6500 },
  { texto = "Más de $10,000", valor = 15000 },
]
anio_grande = [
  { texto = "Nada", valor = 0 },
  { texto = "Menos de $10,000", valor = 7000 },
  { texto = "$10,000 a $30,000", valor = 20000 },
  { texto = "Más de $30,000", valor = 40000 },
]
aumento = [
  { texto = "No sé", omitir = true },
  { texto = "Menos de 4%", valor = 3 },
  { texto = "4% a 8%", valor = 6 },
  { texto = "Más de 8%", valor = 10 },
]

[[pregunta]]
id = "ciudad"
tipo = "ciudad"
texto = "¿En qué ciudad vives? Si no está en la lista del INPC, dime la más cercana."

[[pregunta]]
id = "vivienda"
tipo = "opcion"
texto = "¿Tu casa es rentada, propia o prestada (vives con familia sin pagar renta)?"
opciones = [
  { valor = "rentada", texto = "Rentada" },
  { valor = "propia", texto = "Propia (pagada o con hipoteca)" },
  { valor = "prestada", texto = "Prestada o de la familia, sin pagar renta" },
]

[[pregunta]]
id = "renta"
escala = "mes_grande"
tipo = "monto"
cada = "mes"
rubros = ["renta"]
si = { pregunta = "vivienda", es = "rentada" }
texto = "¿Cuánto pagas de renta al mes?"

[[pregunta]]
id = "aumento_renta"
escala = "aumento"
tipo = "porcentaje"
aumento_propio = "renta"
opcional = true
si = { pregunta = "renta", mayor_que = 0 }
texto = "¿Cuánto te subieron la renta en el último año, en porcentaje? Si no sabes, sáltala."

[[pregunta]]
id = "hipoteca"
escala = "mes_grande"
tipo = "monto"
cada = "mes"
no_cubierto = "hipoteca"
si = { pregunta = "vivienda", es = "propia" }
texto = "¿Pagas hipoteca? ¿Cuánto al mes? (Es deuda: la reporto aparte, no mueve tu inflación)."

